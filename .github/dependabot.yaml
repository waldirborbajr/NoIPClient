# Dependabot configuration for noip-client
version: 2

updates:
  # Rust dependencies (Cargo)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "03:00"
      timezone: "America/Sao_Paulo"   # Adjust to your timezone
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    reviewers:
      - "waldirborbajr"                 # ← Replace with your username
    # Ignore updates that may be too disruptive
    ignore:
      - dependency-name: "*"          # Ignore all by default (optional)
        update-types: ["version-update:semver-major"]
      - dependency-name: "regex"      # Example: only allow patch/minor updates for critical crates
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "03:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # Dependabot itself (optional but recommended)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

# Global settings
pull-requests:
  # Group patch/minor updates to reduce noise
  group:
    - dependency-type: "production"
      update-types:
        - "patch"
        - "minor"
    - dependency-type: "development"
      update-types:
        - "patch"
        - "minor"
