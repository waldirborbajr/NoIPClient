name: Setup Rust
description: "Toolchain + sccache + dependency cache, shared between CI and release"

inputs:
  targets:
    description: "Extra rustup targets (comma-separated)"
    default: ""
  components:
    description: "rustup components (e.g. rustfmt, clippy)"
    default: ""
  sccache:
    description: "Enable sccache (\"true\" or \"false\")"
    default: "true"
  sccache-key:
    description: "Suffix for the sccache cache key (e.g. the target or the job name)"
    default: default
  rust-cache:
    description: "Enable Swatinem/rust-cache (\"true\" or \"false\")"
    default: "true"
  shared-key:
    description: "shared-key for Swatinem/rust-cache"
    default: ""
  cache-key:
    description: "Additional key for Swatinem/rust-cache"
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - name: Configure sccache
      if: inputs.sccache == 'true'
      shell: bash
      run: |
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_CACHE_SIZE=5G"
          echo "SCCACHE_DIR=${{ github.workspace }}/.sccache"
        } >> "$GITHUB_ENV"

    - name: Install sccache
      if: inputs.sccache == 'true'
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Cache sccache
      if: inputs.sccache == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.sccache
        key: sccache-${{ runner.os }}-${{ inputs.sccache-key }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          sccache-${{ runner.os }}-${{ inputs.sccache-key }}-

    - name: Cache cargo
      if: inputs.rust-cache == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.shared-key }}
        key: ${{ inputs.cache-key }}
