name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  RUST_BACKTRACE: full

permissions:
  packages: write
  contents: write

jobs:
  release:
    name: Create release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "Release ${GITHUB_REF_NAME}" \
            --verify-tag

  build-unix:
    name: Build ${{ matrix.job.os }} (${{ matrix.job.target }})
    permissions:
      contents: write
    runs-on: ${{ matrix.job.os }}
    needs: release
    env:
      BIN: noip-client
      ARCHIVE: noip-client-${{ github.ref_name }}-${{ matrix.job.target }}.tar.gz
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-latest, target: i686-unknown-linux-gnu, use-cross: true }
          - { os: ubuntu-latest, target: i686-unknown-linux-musl, use-cross: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, use-cross: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.job.target }}
          sccache: ${{ !matrix.job.use-cross }}
          sccache-key: ${{ matrix.job.target }}
          rust-cache: "false"

      - name: Install cross
        if: matrix.job.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          tool=cargo
          [[ "${{ matrix.job.use-cross }}" == "true" ]] && tool=cross
          "$tool" build --release --locked --target "${{ matrix.job.target }}"

      - name: sccache stats
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        shell: bash
        run: sccache --show-stats

      - name: Verify, strip and archive
        shell: bash
        run: |
          set -euo pipefail
          dir="target/${{ matrix.job.target }}/release"
          test -f "$dir/$BIN"
          test -x "$dir/$BIN"
          strip "$dir/$BIN" || true
          tar czf "$ARCHIVE" -C "$dir" "$BIN"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" "$ARCHIVE" --clobber

  build-termux:
    name: Build Termux (${{ matrix.job.target }})
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: release
    strategy:
      fail-fast: false
      matrix:
        job:
          # Termux primary: modern phones (arm64).
          - { target: aarch64-linux-android,  api: 24, termux_arch: aarch64 }
          # Termux secondary: older 32-bit phones.
          - { target: armv7-linux-androideabi, api: 24, termux_arch: arm }
          # Termux on x86_64 emulators / ChromeOS Linux (rare, but cheap).
          - { target: x86_64-linux-android,   api: 24, termux_arch: x86_64 }
    env:
      BIN: noip-client
      ARCHIVE: noip-client-${{ github.ref_name }}-${{ matrix.job.target }}.tar.gz
    steps:
      - uses: actions/checkout@v6

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Add Android target
        run: rustup target add ${{ matrix.job.target }}

      # cross ships Android NDK images. The env vars below tell it which
      # API level to link against. Bump `api` in the matrix to raise it.
      - name: Build for Termux
        env:
          CROSS_ANDROID_API: ${{ matrix.job.api }}
        run: |
          set -euo pipefail
          cross build \
            --release \
            --locked \
            --target "${{ matrix.job.target }}"

      - name: Verify, strip and archive
        shell: bash
        run: |
          set -euo pipefail
          dir="target/${{ matrix.job.target }}/release"
          test -f "$dir/$BIN"
          test -x "$dir/$BIN"

          # NDK ships its own llvm-strip; make sure we use it, not the host's.
          STRIP=$(find "${ANDROID_NDK_HOME:-/usr/local/lib/android/sdk/ndk}" \
                  -type f -name 'llvm-strip' 2>/dev/null | head -n1 || true)
          if [[ -n "${STRIP}" ]]; then
            "$STRIP" --strip-all "$dir/$BIN" || true
          else
            # Fallback: cross also ships an aarch64-linux-android-strip.
            SYSROOT_STRIP=$(command -v "${{ matrix.job.target }}-strip" || true)
            [[ -n "$SYSROOT_STRIP" ]] && "$SYSROOT_STRIP" --strip-all "$dir/$BIN" || true
          fi

          tar czf "$ARCHIVE" -C "$dir" "$BIN"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" "$ARCHIVE" --clobber
